name: E2E

on:
  workflow_dispatch:
    inputs:
      isolated_ai_settings:
        description: Run the AI settings security checks in an offline Docker sandbox
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ !inputs.isolated_ai_settings }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: otter_test
          POSTGRES_PASSWORD: otter_test_password
          POSTGRES_USER: otter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otter -d otter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://otter:otter_test_password@127.0.0.1:5432/otter_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate
      - run: npm run test:e2e -- --workers=1

  ai-settings-isolation:
    if: ${{ inputs.isolated_ai_settings }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Prepare locked Linux dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run checks with isolated loopback, dummy PostgreSQL, and no external network
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/otter-ai-isolation.XXXXXX")"
          cleanup() {
            docker rm --force otter-ai-verify otter-ai-postgres otter-ai-node-source >/dev/null 2>&1 || true
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          mkdir -p "$scratch/source" "$scratch/empty" node_modules/.vite node_modules/.vite-temp node_modules/.vitest-cache
          git archive HEAD | tar -x -C "$scratch/source"
          playwright_version="$(node -p 'require("./node_modules/@playwright/test/package.json").version')"
          browser_image="mcr.microsoft.com/playwright:v${playwright_version}-noble"
          docker pull node:26-bookworm
          docker pull postgres:17-bookworm
          docker pull "$browser_image"
          docker create --name otter-ai-node-source node:26-bookworm >/dev/null
          docker cp otter-ai-node-source:/usr/local "$scratch/node"
          docker rm otter-ai-node-source >/dev/null
          chmod -R a+rX "$scratch/source" "$scratch/node"

          docker run --detach --name otter-ai-postgres \
            --network none --read-only --user 999:999 \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 1 --memory 512m --memory-swap 512m --pids-limit 64 \
            --ulimit cpu=900:900 --ulimit fsize=134217728:134217728 \
            --ulimit nofile=256:256 --ulimit nproc=64:64 \
            --log-opt max-size=1m --log-opt max-file=1 \
            --tmpfs /scratch:rw,nosuid,nodev,size=512m,uid=999,gid=999,mode=0700 \
            --tmpfs /var/run/postgresql:rw,nosuid,nodev,size=1m,uid=999,gid=999,mode=0700 \
            --mount "type=bind,source=$scratch/empty,target=/var/lib/postgresql/data,readonly" \
            --mount "type=bind,source=$scratch/empty,target=/dev/shm,readonly" \
            --mount "type=bind,source=$scratch/empty,target=/dev/mqueue,readonly" \
            --entrypoint /usr/bin/env postgres:17-bookworm \
            -i PATH=/usr/lib/postgresql/17/bin:/usr/local/bin:/usr/bin:/bin \
            HOME=/scratch TMPDIR=/scratch PGDATA=/scratch/data LANG=C.UTF-8 \
            POSTGRES_INITDB_ARGS=--encoding=UTF8 \
            POSTGRES_USER=otter POSTGRES_PASSWORD=otter_test_password POSTGRES_DB=otter_test \
            /usr/local/bin/docker-entrypoint.sh postgres \
            -c listen_addresses=127.0.0.1 \
            -c shared_buffers=32MB -c max_connections=30 -c dynamic_shared_memory_type=mmap
          ready=false
          for _ in {1..30}; do
            if docker exec otter-ai-postgres /usr/bin/env -i \
              PATH=/usr/lib/postgresql/17/bin:/usr/bin:/bin \
              pg_isready -h 127.0.0.1 -U otter -d otter_test; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs otter-ai-postgres
            exit 1
          fi

          timeout --signal=TERM --kill-after=10s 15m docker run --rm --name otter-ai-verify --init \
            --network container:otter-ai-postgres --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 3g --memory-swap 3g --pids-limit 256 \
            --ulimit cpu=600:600 --ulimit fsize=134217728:134217728 \
            --ulimit nofile=1024:1024 --ulimit nproc=256:256 \
            --log-opt max-size=1m --log-opt max-file=1 \
            --tmpfs /scratch:rw,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /scratch/repo:rw,nosuid,nodev,size=1g,uid=65534,gid=65534,mode=0755 \
            --tmpfs /scratch/repo/node_modules/.vite:rw,nosuid,nodev,size=128m,uid=65534,gid=65534 \
            --tmpfs /scratch/repo/node_modules/.vite-temp:rw,nosuid,nodev,size=16m,uid=65534,gid=65534 \
            --tmpfs /scratch/repo/node_modules/.vitest-cache:rw,nosuid,nodev,size=192m,uid=65534,gid=65534 \
            --mount "type=bind,source=$scratch/source,target=/input,readonly" \
            --mount "type=bind,source=$PWD/node_modules,target=/scratch/repo/node_modules,readonly" \
            --mount "type=bind,source=$scratch/node,target=/toolchain,readonly" \
            --mount "type=bind,source=$scratch/empty,target=/dev/shm,readonly" \
            --mount "type=bind,source=$scratch/empty,target=/dev/mqueue,readonly" \
            --workdir /scratch/repo --entrypoint /usr/bin/env "$browser_image" \
            -i PATH=/toolchain/bin:/usr/local/bin:/usr/bin:/bin \
            HOME=/scratch TMPDIR=/scratch XDG_CACHE_HOME=/scratch LANG=C.UTF-8 \
            NPM_CONFIG_CACHE=/scratch/npm-cache NPM_CONFIG_OFFLINE=true \
            NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false \
            CI=true GOMAXPROCS=2 RAYON_NUM_THREADS=2 PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            DATABASE_URL=postgres://otter:otter_test_password@127.0.0.1:5432/otter_test \
            /bin/bash -euo pipefail -c '
              cp -R /input/. .
              npm run check
              npm exec --workspace @narumitw/otter-api -- vitest run \
                src/server-ai-providers.test.ts src/server-ai-settings.test.ts \
                src/server-ai-oauth-cleanup.test.ts src/server-ai-logins.test.ts \
                src/server-ai-logins-races.test.ts src/server-ai-credentials.test.ts \
                src/server.ai-auth.test.ts src/server.ai-auth-device.test.ts
              npm exec --workspace @narumitw/otter-web -- vitest run \
                src/client/ai-provider-connections.component.test.tsx \
                src/client/ai-settings.component.test.tsx
              npm run migrate
              if ! npm run test:e2e -- ai-settings.spec.ts --workers=1; then
                find apps/web/test-results -name error-context.md -type f -exec head -c 16384 {} \;
                exit 1
              fi
            '
