name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      OTTER_IMAGE: otter:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag "${OTTER_IMAGE}" .
      - name: Start services
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          : "${DATABASE_URL:?set DATABASE_URL secret}"
          docker compose --profile production up --detach --wait --wait-timeout 120 --no-build otter
