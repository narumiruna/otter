name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, linux, otter-production]
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      OTTER_IMAGE: otter:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.DEPLOY_SHA }}
      - name: Build image
        run: >-
          docker build --pull
          --label "io.otter.deployment=true"
          --tag "${OTTER_IMAGE}" .
      - name: Start services
        shell: bash
        env:
          OTTER_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          : "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD secret}"
          docker compose --project-name otter-production up --detach --wait --wait-timeout 120 --no-build otter
      - name: Remove superseded deployment images
        shell: bash
        run: |
          while IFS= read -r image; do
            if [[ "${image}" != "${OTTER_IMAGE}" ]]; then
              docker image rm "${image}"
            fi
          done < <(docker image ls --filter "label=io.otter.deployment=true" --format '{{.Repository}}:{{.Tag}}')
