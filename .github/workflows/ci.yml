name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: otter_test
          POSTGRES_PASSWORD: otter_test_password
          POSTGRES_USER: otter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otter -d otter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://otter:otter_test_password@127.0.0.1:5432/otter_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run migrate
      - run: node apps/api/dist/scripts/migrate.js
      - run: npm run test:e2e
      - run: docker build --tag otter-ci .
      - name: Smoke production image
        run: |
          docker run --detach --name otter-ci-app --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env COOKIE_SECURE=false \
            --env PASSKEY_ORIGIN=http://127.0.0.1:17463 \
            otter-ci
          trap 'docker logs otter-ci-app; docker rm --force otter-ci-app' EXIT
          wait_for_url() {
            for _ in {1..30}; do
              if curl --fail --silent "$1" >/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          wait_for_url http://127.0.0.1:17463/api/config
          wait_for_url http://127.0.0.1:17463/
          docker restart otter-ci-app
          wait_for_url http://127.0.0.1:17463/api/config
