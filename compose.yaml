services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: otter_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otter_dev_password}
      POSTGRES_USER: otter
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otter -d otter_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - otter-dev-postgres:/var/lib/postgresql/data

  otter:
    build: .
    image: ${OTTER_IMAGE:-otter:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otter_dev_password}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-http://localhost:17463}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-localhost}
      PORT: 17463
    ports:
      - "17463:17463"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:17463/api/config').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  otter-dev-postgres:
