services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: otter_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otter_dev_password}
      POSTGRES_USER: otter
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otter -d otter_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - otter-dev-postgres:/var/lib/postgresql/data

  otter:
    build: .
    image: ${OTTER_IMAGE:-otter:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${OTTER_DATABASE_URL:-postgres://otter:${POSTGRES_PASSWORD:-otter_dev_password}@postgres:5432/otter_dev}
      PORT: 17463
    ports:
      - "17463:17463"

volumes:
  otter-dev-postgres:
